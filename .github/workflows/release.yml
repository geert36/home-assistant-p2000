name: Release

# Pushing a version tag (for example `git tag 1.3.0 && git push origin 1.3.0`)
# creates a GitHub release with generated notes, after checking that the tag
# matches the version in manifest.json. A release that was already created
# for the tag (for example by hand) is left untouched.

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the manifest version
        run: python scripts/validate_manifest_version.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
